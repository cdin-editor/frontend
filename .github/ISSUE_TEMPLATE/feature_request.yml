name: Feature request
description: Propose a Frontend capability or implementation improvement.
title: "feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Spec requirement or ADR
      placeholder: FE-006 / ADR-0006
    validations:
      required: false
