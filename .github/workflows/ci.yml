name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Build and test with Pipeline
    uses: m-mdy-m/pipeline/.github/workflows/ci.yml@main
    with:
      language: c
      pipeline-task: check
      pipeline-ref: main

  platform-smoke:
    name: ${{ matrix.os }} native Core + TUI UI peer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: macos-15
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: matrix.os == 'ubuntu-24.04'
        name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake git
      - if: matrix.os == 'macos-15'
        name: Install native build tools
        run: brew install cmake
      - if: matrix.os == 'windows-latest'
        name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake
      # GitHub Actions does not permit the matrix context in steps.shell.
      # Keep each shell static and select the matching step with its condition.
      - if: matrix.os != 'windows-latest'
        name: Install pinned standalone m-mdy-m/log.c logger
        shell: bash
        run: bash scripts/install-deps.sh
      - if: matrix.os == 'windows-latest'
        name: Install pinned standalone m-mdy-m/log.c logger
        shell: msys2 {0}
        run: bash scripts/install-deps.sh
      - if: matrix.os != 'windows-latest'
        name: Strict build and tests
        shell: bash
        run: make check
      - if: matrix.os == 'windows-latest'
        name: Strict build and tests
        shell: msys2 {0}
        run: make check
