name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Only the newest commit of a pull request needs a full native matrix.
# Cancel stale in-flight runs when the PR receives another update.
concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Build and test with Pipeline
    uses: m-mdy-m/pipeline/.github/workflows/ci.yml@main
    with:
      language: c
      pipeline-task: check
      pipeline-ref: main

  gui-sdl-package:
    name: SDL3 production adapter + installed consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config curl
      - name: Install pinned production logger
        run: bash scripts/install-deps.sh
      - name: Download and verify pinned SDL3 source
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/SDL3-3.4.16.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/libsdl-org/SDL/releases/download/release-3.4.16/SDL3-3.4.16.tar.gz \
            --output "$archive"
          echo "7322236cd12090c3eb40b9728be4d49c76f66ad17d04369584d4ecad5cf77c68  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/SDL3-source"
          tar -xzf "$archive" -C "$RUNNER_TEMP/SDL3-source" --strip-components=1
      - name: Build and install minimal SDL3
        run: |
          cmake -S "$RUNNER_TEMP/SDL3-source" -B "$RUNNER_TEMP/SDL3-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/SDL3-install" \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON \
            -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            -DSDL_AUDIO=OFF -DSDL_CAMERA=OFF -DSDL_JOYSTICK=OFF \
            -DSDL_HAPTIC=OFF -DSDL_HIDAPI=OFF -DSDL_POWER=OFF -DSDL_SENSOR=OFF \
            -DSDL_VIDEO=ON -DSDL_RENDER=ON -DSDL_DUMMYVIDEO=ON \
            -DSDL_UNIX_CONSOLE_BUILD=ON \
            -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_KMSDRM=OFF \
            -DSDL_OPENGL=OFF -DSDL_OPENGLES=OFF -DSDL_VULKAN=OFF
          cmake --build "$RUNNER_TEMP/SDL3-build" --parallel
          cmake --install "$RUNNER_TEMP/SDL3-build"
      - name: Configure GUI-SDL AddressSanitizer test build
        run: |
          cmake -S . -B build-gui-sdl-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/SDL3-install;$PWD/.deps/log" \
            -DCDIN_FRONTEND_USE_LOG_STUB=OFF \
            -DCDIN_FRONTEND_BUILD_UI_TUI=OFF \
            -DCDIN_FRONTEND_BUILD_UI_SDL=ON \
            -DCDIN_FRONTEND_BUILD_UI_HEADLESS=OFF \
            -DCDIN_FRONTEND_BUILD_APPS=ON \
            -DCDIN_FRONTEND_BUILD_EXAMPLES=OFF \
            -DCDIN_FRONTEND_GUI_SDL_ENABLE_PANE_SPLITTER=ON \
            -DBUILD_TESTING=ON
      - name: Build and run GUI-SDL tests under AddressSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
        run: |
          cmake --build build-gui-sdl-asan --parallel
          ctest --test-dir build-gui-sdl-asan --output-on-failure

      - name: Configure production GUI-SDL package
        run: |
          cmake -S . -B build-gui-sdl -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/SDL3-install;$PWD/.deps/log" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/frontend-install" \
            -DCDIN_FRONTEND_USE_LOG_STUB=OFF \
            -DCDIN_FRONTEND_BUILD_UI_TUI=OFF \
            -DCDIN_FRONTEND_BUILD_UI_SDL=ON \
            -DCDIN_FRONTEND_BUILD_UI_HEADLESS=OFF \
            -DCDIN_FRONTEND_BUILD_APPS=ON \
            -DCDIN_FRONTEND_BUILD_EXAMPLES=OFF \
            -DBUILD_TESTING=ON
      - name: Build, test and install production GUI-SDL package
        run: |
          cmake --build build-gui-sdl --parallel
          ctest --test-dir build-gui-sdl --output-on-failure
          cmake --install build-gui-sdl
      - name: Verify clean-prefix GUI-SDL consumer
        run: |
          mkdir -p "$RUNNER_TEMP/gui-sdl-consumer"
          cat > "$RUNNER_TEMP/gui-sdl-consumer/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(gui_sdl_consumer C)
          find_package(cdinFrontend 1.0 CONFIG REQUIRED)
          add_executable(gui_sdl_consumer main.c)
          target_link_libraries(gui_sdl_consumer PRIVATE cdin::frontend_ui_gui_sdl)
          EOF
          cat > "$RUNNER_TEMP/gui-sdl-consumer/main.c" <<'EOF'
          #include <cdin/frontend/ui/gui_sdl/gui_sdl.h>
          int main(void) {
              cdin_frontend_gui_sdl_destroy(NULL);
              return CDIN_FRONTEND_GUI_SDL_OK;
          }
          EOF
          cmake -S "$RUNNER_TEMP/gui-sdl-consumer" -B "$RUNNER_TEMP/gui-sdl-consumer-build" -G Ninja \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/frontend-install;$RUNNER_TEMP/SDL3-install;$PWD/.deps/log"
          cmake --build "$RUNNER_TEMP/gui-sdl-consumer-build" --parallel

  platform-smoke:
    name: ${{ matrix.os }} native Core + TUI UI peer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: macos-15
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: matrix.os == 'ubuntu-24.04'
        name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake git
      - if: matrix.os == 'macos-15'
        name: Install native build tools
        run: brew install cmake
      - if: matrix.os == 'windows-latest'
        name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake
      # GitHub Actions does not permit the matrix context in steps.shell.
      # Keep each shell static and select the matching step with its condition.
      - if: matrix.os != 'windows-latest'
        name: Install pinned standalone m-mdy-m/log.c logger
        shell: bash
        run: bash scripts/install-deps.sh
      - if: matrix.os == 'windows-latest'
        name: Install pinned standalone m-mdy-m/log.c logger
        shell: msys2 {0}
        run: bash scripts/install-deps.sh
      - if: matrix.os != 'windows-latest'
        name: Strict build and tests
        shell: bash
        run: make check
      - if: matrix.os == 'windows-latest'
        name: Strict build and tests
        shell: msys2 {0}
        run: make check
