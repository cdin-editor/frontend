name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Build and test with Pipeline
    uses: m-mdy-m/pipeline/.github/workflows/ci.yml@main
    with:
      language: c
      pipeline-task: check
      pipeline-ref: main

  docs:
    name: Documentation and workflow validation
    uses: m-mdy-m/pipeline/.github/workflows/docs-check.yml@main

  structure:
    name: Repository structure and governance (PSX)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install PSX
        run: curl -sSL https://raw.githubusercontent.com/m-mdy-m/psx/main/scripts/install.sh | bash
      - name: Check repository structure
        run: psx check

  platform-smoke:
    name: ${{ matrix.os }} native Core + TUI UI peer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            shell: bash
          - os: macos-15
            shell: bash
          - os: windows-latest
            shell: msys2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: matrix.os == 'ubuntu-24.04'
        name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake git
      - if: matrix.os == 'macos-15'
        name: Install native build tools
        run: brew install cmake
      - if: matrix.shell == 'msys2'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make mingw-w64-ucrt-x86_64-cmake
      - name: Install pinned standalone m-mdy-m/log.c logger
        shell: ${{ matrix.shell == 'msys2' && 'msys2 {0}' || 'bash' }}
        run: bash scripts/install-deps.sh
      - name: Strict build and tests
        shell: ${{ matrix.shell == 'msys2' && 'msys2 {0}' || 'bash' }}
        run: make check
